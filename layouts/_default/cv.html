{{ define "main" }}
{{- /* The CV page: circuit figure (cv-figure.html), the selected station or the full timeline (cv.html). */}}
<div class="page-head cv-head">
  <h1>{{ .Title }}</h1>
  <button class="cv-toggle" type="button" aria-expanded="false" aria-controls="cv-list" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg><span>Show timeline</span></button>
</div>
{{ .Content }}
{{ partial "cv-figure.html" . }}
{{ partial "cv.html" . }}
{{ end }}

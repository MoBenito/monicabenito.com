{{ define "main" }}
<article class="prose">
  <h1>{{ .Title }}</h1>
  {{- if eq .Section "news" }}<p class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time></p>{{ end }}
  {{- partial "featured.html" (dict "page" . "width" 760 "alt" "" "class" "featured" "eager" true) }}
  {{ .Content }}
</article>
{{ end }}

{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<div class="tiles grid">
  {{- range .Pages.ByWeight }}
  <article class="reveal tile stacked">
    <div class="tile-thumb">{{ partial "featured.html" (dict "page" . "width" 480 "alt" "") }}</div>
    <div>
      <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
      <p class="teaser">{{ .Summary | plainify | truncate 140 }}</p>
    </div>
  </article>
  {{- end }}
</div>
{{ end }}

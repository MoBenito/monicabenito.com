# Weekly: builds the site and checks every link on it (tools/linkcheck.py). Broken links are reported in one issue
# titled "Broken links", updated on each run and closed automatically once everything works again.
name: Links

on:
  schedule:
    - cron: "41 5 * * 1"   # Mondays at 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: links
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TITLE: Broken links
    steps:
      - uses: actions/checkout@v7

      - name: Hugo version (from .hugo-version)
        run: echo "HUGO_VERSION=$(cat .hugo-version)" >> "$GITHUB_ENV"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: hugo build --gc --minify --baseURL https://monicabenito.com/

      - name: Check links
        id: check
        run: |
          if python tools/linkcheck.py public --report report.md; then
            echo "broken=false" >> "$GITHUB_OUTPUT"
          else
            echo "broken=true" >> "$GITHUB_OUTPUT"
          fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close the issue
        run: |
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ "${{ steps.check.outputs.broken }}" = "true" ]; then
            {
              echo "The weekly link check found links on the site that do not work. Fix or remove them in the page"
              echo "named next to each link; this issue closes by itself once the check passes."
              echo
              cat report.md
              echo
              echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > body.md
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file body.md
            else
              gh issue create --title "$TITLE" --body-file body.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "All links work again (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          fi
